name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the release key, if the repository has one
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key."
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WifiConnect.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WifiConnect-apk
          path: android/WifiConnect.apk
      # Also put it on the "Latest build" release, so anyone can download it without a GitHub
      # account, and it doesn't expire like the artifact above (90 days).
      - name: Publish to the Latest build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest > /dev/null 2>&1 ||
            gh release create latest --title "Latest build" --notes "Download WifiConnect.ipa (iPhone, install with Sideloadly or AltStore from a Windows PC: no Mac needed) or WifiConnect.apk (Android). Step-by-step guide: docs/INSTALL.md" ||
            sleep 10 # The other platform's build may have just created it.
          gh release upload latest WifiConnect.apk --clobber
