name: Screenshots

# Runs both apps in the iPhone simulator and the Android emulator, then commits
# the screenshots to the screenshots/ folder of the branch it ran on.
on:
  workflow_dispatch:
  # Also when this file changes, so the pictures can be retaken with a push
  # (for example after a change to how the app looks, like fitting small screens, aligning the details card, adding the ? guide, the Apple design pass, the bolder titles or the UI review fixes).
  push:
    paths:
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project WifiConnect.xcodeproj \
            -target WifiConnect \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Install applesimutils (allows notifications in the simulator)
        continue-on-error: true
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          { brew tap wix/brew && brew install wix/brew/applesimutils; } > /tmp/applesimutils.log 2>&1 \
            || { echo "applesimutils install failed"; tail -30 /tmp/applesimutils.log; exit 1; }

      - name: Take screenshots
        run: |
          bash scripts/ios-screenshots.sh ios/build/Debug-iphonesimulator/WifiConnect.app
          echo "applesimutils: $(command -v applesimutils || echo missing)"
          tail -15 /tmp/applesimutils.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios
          path: new-screenshots/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/android-screenshots.sh android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: new-screenshots/

  commit:
    needs: [ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: screenshots
          merge-multiple: true

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update screenshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
