name: Build iPhone app

# Builds an unsigned WifiConnect.ipa on a GitHub-hosted Mac, so no Mac is needed.
# Sign and install it from Windows with Sideloadly (see README).
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        working-directory: ios
        run: |
          xcodebuild build \
            -project WifiConnect.xcodeproj \
            -target WifiConnect \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/WifiConnect.app Payload/
          zip -qry WifiConnect.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WifiConnect-ipa
          path: ios/WifiConnect.ipa

      # Also put it on the "Latest build" release, so anyone can download it without a GitHub
      # account, and it doesn't expire like the artifact above (90 days).
      - name: Publish to the Latest build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest > /dev/null 2>&1 ||
            gh release create latest --title "Latest build" --notes "Download WifiConnect.ipa (iPhone, install with Sideloadly or AltStore from a Windows PC: no Mac needed) or WifiConnect.apk (Android). Step-by-step guide: docs/INSTALL.md" ||
            sleep 10 # The other platform's build may have just created it.
          gh release upload latest ios/WifiConnect.ipa --clobber
