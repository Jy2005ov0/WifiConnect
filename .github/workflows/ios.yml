name: Build iPhone app

# Builds an unsigned WifiConnect.ipa on a GitHub-hosted Mac, so no Mac is needed.
# Sign and install it from Windows with Sideloadly (see README).
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        working-directory: ios
        run: |
          xcodebuild build \
            -project WifiConnect.xcodeproj \
            -target WifiConnect \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/WifiConnect.app Payload/
          zip -qry WifiConnect.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WifiConnect-ipa
          path: ios/WifiConnect.ipa
