name: Test

# Checks that both apps really sign in: each app runs in a simulator/emulator
# against a mock campus login page (scripts/mock_portal.py).
on:
  push:
    paths:
      - "ios/**"
      - "android/**"
      - "scripts/**"
      - "windows/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project WifiConnect.xcodeproj \
            -target WifiConnect \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Start mock login page
        run: nohup python3 scripts/mock_portal.py 8080 > portal.log 2>&1 &

      - name: Sign in through the app
        run: bash scripts/ios-e2e.sh ios/build/Debug-iphonesimulator/WifiConnect.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ios
          path: |
            e2e/
            portal.log

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Start mock login page
        run: nohup python3 scripts/mock_portal.py 8080 > portal.log 2>&1 &

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sign in through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/android-e2e.sh android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-android
          path: |
            e2e/
            portal.log

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start mock login page
        shell: pwsh
        run: Start-Process python -ArgumentList 'scripts/mock_portal.py', '8080' -RedirectStandardOutput portal.log -RedirectStandardError portal-err.log

      # Windows PowerShell 5.1, the same one the scheduled task uses.
      - name: Sign in through the Windows script
        shell: powershell
        run: ./scripts/windows-e2e.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-windows
          path: |
            portal.log
            portal-err.log
