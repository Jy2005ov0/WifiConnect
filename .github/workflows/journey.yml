name: User journey

# Uses each app the way a student would, by tapping and typing on the screen:
# install, welcome page, type the student ID and password, tap to connect, check the
# internet works, leave and come back, sign out. Against scripts/mock_portal.py.
on:
  workflow_dispatch:
  push:
    paths:
      - android/**
      - ios/**
      - windows/**
      - scripts/*journey*
      - scripts/ui_find.py
      - scripts/mock_portal.py
      - .github/workflows/journey.yml

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project WifiConnect.xcodeproj \
            -target WifiConnect \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Install the tools that tap and type
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          # applesimutils answers the notifications question like a user tapping Allow.
          { brew tap wix/brew && brew install wix/brew/applesimutils; } > /tmp/applesimutils.log 2>&1 \
            || echo "::warning::applesimutils didn't install: $(tail -3 /tmp/applesimutils.log | tr '\n' ' ')"
          # idb taps and types in the simulator. Homebrew won't build its companion on this
          # Mac, so use the ready-made one from its releases.
          curl -fsSL -o /tmp/idb-companion.tar.gz \
            https://github.com/facebook/idb/releases/download/v1.1.8/idb-companion.universal.tar.gz
          mkdir -p "$HOME/idb-companion"
          tar -xzf /tmp/idb-companion.tar.gz -C "$HOME/idb-companion"
          companion=$(find "$HOME/idb-companion" -name idb_companion -type f | head -1)
          [[ -n "$companion" ]] || { echo "::error::idb_companion not found in the download"; exit 1; }
          echo "$(dirname "$companion")" >> "$GITHUB_PATH"
          python3 -m venv "$HOME/idb"
          "$HOME/idb/bin/pip" install --quiet fb-idb
          echo "$HOME/idb/bin" >> "$GITHUB_PATH"
          "$companion" --version || echo "::warning::idb_companion --version failed"

      - name: Start mock login page
        run: nohup python3 scripts/mock_portal.py 8080 > portal.log 2>&1 &

      - name: Use the app like a student
        run: bash scripts/ios-journey.sh ios/build/Debug-iphonesimulator/WifiConnect.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-ios
          path: |
            journey/
            portal.log

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug build
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Start mock login page
        run: nohup python3 scripts/mock_portal.py 8080 > portal.log 2>&1 &

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Use the app like a student
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/android-journey.sh android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-android
          path: |
            journey/
            portal.log

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install and use it like a student
        shell: powershell
        run: ./scripts/windows-journey.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-windows
          path: |
            portal.log
            portal-err.log
